spring.application.name=tamara-aws-lambda

# base host for short URLs
app.base-url=http://localhost:8040
server.port=8040

# SpringBoot Admin console ---------------------------------------------------------------
spring.boot.admin.client.url=http://localhost:9050  

management.security.enabled = false
management.port=9000
#management.endpoints.web.exposure.include=* 
management.endpoints.web.exposure.include=health,info,threaddump,metrics,loggers,beans,env,hawtio,jolokia,prometheus,awslambdacontrol
spring.jmx.enabled = true
management.info.env.enabled=true
management.endpoint.health.show-details=always
management.endpoints.web.base-path = /
management.endpoints.web.path-mapping.hawtio = hawtio/console

# Grafana
management.metrics.tags.application=${spring.application.name}

spring.boot.admin.client.username=admin
spring.boot.admin.client.password=admin

spring.security.user.name=client
spring.security.user.password=client
spring.boot.admin.client.instance.metadata.user.name=${spring.security.user.name}
spring.boot.admin.client.instance.metadata.user.password=${spring.security.user.password}

#spring.boot.admin.routes.endpoints=env, metrics, trace, jolokia, info, configprops
